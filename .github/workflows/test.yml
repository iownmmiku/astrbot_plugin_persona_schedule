name: test

on:
  push:
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          pip install -r requirements.txt ruff
      - name: Lint
        run: ruff check .
      - name: Unit tests
        # The plugin directory must be importable as astrbot_plugin_persona_schedule.
        run: |
          mkdir -p ../pkg && ln -s "$PWD" ../pkg/astrbot_plugin_persona_schedule
          cd ../pkg/astrbot_plugin_persona_schedule
          python -m unittest discover -s tests -p "test_*.py"
  webui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: node tests/test_ui_state.cjs
